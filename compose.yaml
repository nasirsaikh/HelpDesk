services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    env_file: .env
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_HOST: db
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - private_media:/app/private_media
      - staticfiles:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    command: ["python", "manage.py", "run_tenant_jobs", "--watch"]
    env_file: .env
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_HOST: db
    volumes:
      - private_media:/app/private_media
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
  private_media:
  staticfiles:
