{% extends 'base.html' %}{% block title %}Tickets{% endblock %}{% block content %}<div class="page-heading"><div><div class="eyebrow">Service desk</div><h1>Tickets</h1><p>Manage requests, ownership and progress.</p></div>{% if can_create_ticket %}<a class="btn btn-primary" href="{% url 'desk:ticket-create' %}">+ Create request</a>{% endif %}</div><section class="card"><form class="filter-bar" method="get" hx-get="{% url 'desk:ticket-list' %}" hx-target="#ticket-results" hx-trigger="input changed delay:350ms from:input, change from:select, submit"><input type="search" name="q" value="{{ query }}" placeholder="Search references or requests…" aria-label="Search tickets"><select name="status" aria-label="Ticket status"><option value="">All statuses</option>{% for value,label in statuses %}<option value="{{ value }}" {% if request.GET.status == value %}selected{% endif %}>{{ label }}</option>{% endfor %}</select><button class="btn btn-secondary" type="submit">Filter</button><span class="htmx-indicator">Searching…</span></form><div id="ticket-results">{% include 'partials/ticket_table.html' %}</div></section>{% endblock %}
