{% if form.non_field_errors %}<div class="alert error">{{ form.non_field_errors }}</div>{% endif %}
<div class="form-grid">{% for field in form %}<div class="field {% if field.field.widget.input_type == 'checkbox' and not field.field.widget.allow_multiple_selected %}checkbox-field{% endif %} {% if field.field.widget.attrs.rows %}wide{% endif %}"><label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required">*</span>{% endif %}</label>{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{% if field.errors %}<div class="field-errors">{{ field.errors }}</div>{% endif %}</div>{% endfor %}</div>
