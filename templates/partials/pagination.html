{% if page.has_other_pages %}<div class="pagination"><span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} records</span><div>{% if page.has_previous %}<a class="btn btn-secondary btn-small" href="?page={{ page.previous_page_number }}&q={{ query|urlencode }}&status={{ request.GET.status|urlencode }}">Previous</a>{% endif %}{% if page.has_next %}<a class="btn btn-secondary btn-small" href="?page={{ page.next_page_number }}&q={{ query|urlencode }}&status={{ request.GET.status|urlencode }}">Next</a>{% endif %}</div></div>{% endif %}
