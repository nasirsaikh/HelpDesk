name: Django tenant isolation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test apps.desk.tests --verbosity 1
      - name: Production static assets
        env:
          DJANGO_DEBUG: "0"
          DJANGO_SECRET_KEY: "ci-only-secret-for-build-validation-never-use-in-production"
        run: python manage.py collectstatic --noinput
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: helpdesk
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: helpdesk
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U helpdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py test apps.desk.tests --verbosity 1
